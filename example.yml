default: project-x

# Per-repo override: create .branch-helper-default in a project root
# with the alias name on the first line and optionally:
#   base_branch: master

aliases:
  project-x:
    source: jira
    base_branch: main
    jira:
      domain: "your-org.atlassian.net"
      username: "you@example.com"
      token: "your-jira-api-token"

  elmosgot:
    source: github
    base_branch: master
    github:
      token: "ghp_your-github-personal-access-token"

  my-linear:
    source: linear
    base_branch: master
    linear:
      token: "lin_api_your-personal-api-key"
