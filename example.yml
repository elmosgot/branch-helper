default: project-x

# Per-repo override: create .branch-helper-default in a project root
# with the alias name on the first line (e.g. elmosgot or project-x).

aliases:
  project-x:
    source: jira
    jira:
      domain: "your-org.atlassian.net"
      username: "you@example.com"
      token: "your-jira-api-token"

  elmosgot:
    source: github
    github:
      token: "ghp_your-github-personal-access-token"
